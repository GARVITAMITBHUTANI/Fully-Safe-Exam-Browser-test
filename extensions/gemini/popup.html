<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gemini Screen Assistant</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      padding: 14px;
      margin: 0;
      background: #18181b;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      color: #38bdf8;
    }
    .desc {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">✦ FSEB Gemini Assistant</span>
  </div>
  <p class="desc">
    Use the native FSEB AI side panel (click "✦ AI Assistant" in the bottom taskbar or press Ctrl+Shift+A) to capture the exam screen and solve questions directly.
  </p>
  <button class="btn" id="btn-open-panel">Open AI Assistant Panel</button>
  <script src="popup.js"></script>
</body>
</html>
