<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safe Exam Browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .splash-card {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #d4d4d8;
    }
    .splash-body {
      display: flex;
      flex: 1;
      padding: 24px 22px;
      align-items: center;
    }
    .splash-logo {
      flex: 0 0 145px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .splash-logo-svg {
      width: 130px;
      height: 130px;
    }
    .splash-info {
      flex: 1;
      padding-left: 20px;
    }
    .splash-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .splash-bold-orange {
      font-size: 34px;
      font-weight: 800;
      color: #e36c09;
      font-family: Arial, sans-serif;
      letter-spacing: -0.5px;
    }
    .splash-sub-text {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.15;
      font-weight: 600;
      text-transform: uppercase;
    }
    .splash-meta-text {
      font-size: 13px;
      color: #374151;
      line-height: 1.35;
    }
    .splash-ver-bold {
      font-weight: 600;
      color: #1f2937;
    }
    .splash-meta-dim {
      color: #6b7280;
    }
    .splash-progress {
      width: 100%;
      height: 14px;
      background: #f3f4f6;
      border-top: 1px solid #e5e7eb;
      position: absolute;
      bottom: 0;
      left: 0;
    }
    .splash-green-bar {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-body">
      <div class="splash-logo">
        <svg viewBox="0 0 100 100" class="splash-logo-svg">
          <!-- Globe -->
          <circle cx="50" cy="50" r="46" fill="#1d70b8" />
          <path d="M22 42 Q32 26 50 35 Q65 44 76 34 Q86 52 68 70 Q46 86 28 68 Z" fill="#e36c09" />
          <path d="M54 18 Q68 14 80 24 Q74 34 58 28 Z" fill="#e36c09" />
          <!-- Tilted Key Handle & Shaft -->
          <g transform="translate(42, 46) rotate(-22)">
            <rect x="-24" y="-12" width="22" height="22" rx="3" fill="none" stroke="#2b2b2b" stroke-width="5" />
            <rect x="-2" y="-5" width="26" height="10" rx="2" fill="#2b2b2b" />
            <rect x="18" y="-1" width="8" height="6" fill="#2b2b2b" />
          </g>
        </svg>
      </div>
      <div class="splash-info">
        <div class="splash-title-row">
          <span class="splash-bold-orange">SEB</span>
          <span class="splash-sub-text">Safe<br>Exam<br>Browser</span>
        </div>
        <div class="splash-meta-text">
          <div class="splash-ver-bold">Version 3.10.2 (x64)</div>
          <div class="splash-meta-dim">Build 3.10.2.830</div>
          <div class="splash-meta-dim" style="margin-top: 5px;">Copyright &copy; 2025 ETH Z&uuml;rich</div>
          <div class="splash-meta-dim">IT Services</div>
        </div>
      </div>
    </div>
    <div class="splash-progress">
      <div id="green-bar" class="splash-green-bar"></div>
    </div>
  </div>

  <script>
    const bar = document.getElementById('green-bar');
    // Animate green bar from 0% to 35% during Stage 1
    requestAnimationFrame(() => {
      setTimeout(() => {
        bar.style.width = '35%';
      }, 80);
    });
  </script>
</body>
</html>
